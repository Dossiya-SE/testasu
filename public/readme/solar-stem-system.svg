<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Solar plus STEM systems architecture</title><desc id="desc">Adaptive light and dark visual separating solar energy availability, digital learning interaction, impact inference and product-versus-field evidence for an education technology prototype.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--haz:#b91c1c;--iface:#7e22ce;--dec:#a16207;--hyp:#be185d}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--haz:#fb7185;--iface:#c084fc;--dec:#facc15;--hyp:#f472b6}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.state{stroke:var(--state);fill:none}.viable{stroke:var(--viable);fill:none}.hyp{stroke:var(--hyp);fill:none}.unc{stroke:var(--unc);fill:none}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="820" rx="28"/><text x="70" y="70" class="fg" font-size="35" font-weight="800">SOLAR + STEM — PHYSICAL ENERGY → DIGITAL LEARNING → VALIDATION</text><text x="70" y="104" class="muted" font-size="16">implemented web prototype · educational-impact claims remain future empirical gates</text>
<rect x="70" y="145" width="430" height="265" rx="20" class="panel"/><text x="95" y="185" class="fg" font-size="21" font-weight="700">1 · Solar energy subsystem</text><text x="95" y="225" class="fg math" font-size="18">Eₚᵥ=∫Pₚᵥ(t)dt</text><text x="95" y="257" class="fg math" font-size="18">SOCₜ₊₁=SOCₜ+ηcEch−Edis/ηd</text><circle cx="155" cy="330" r="29" fill="var(--dec)"/><text x="155" y="335" text-anchor="middle" fill="var(--bg)" font-size="12" font-weight="700">SUN</text><rect x="245" y="303" width="82" height="55" rx="8" fill="var(--obs)"/><text x="286" y="336" text-anchor="middle" fill="var(--bg)" font-size="12" font-weight="700">PV</text><rect x="375" y="303" width="82" height="55" rx="8" fill="var(--viable)"/><text x="416" y="336" text-anchor="middle" fill="var(--bg)" font-size="12" font-weight="700">BATTERY</text><path d="M184 330H243M327 330H373" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><text x="95" y="390" class="muted" font-size="12">physical availability constrains digital-learning availability</text><path d="M500 275H558" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
<rect x="558" y="145" width="430" height="265" rx="20" class="panel"/><text x="583" y="185" class="fg" font-size="21" font-weight="700">2 · Learning interaction</text><text x="583" y="225" class="fg math" font-size="18">zₜ=[access,engagement,mastery]</text><text x="583" y="257" class="fg math" font-size="18">zₜ₊₁=F(zₜ,contentₜ,feedbackₜ)</text><circle cx="655" cy="330" r="32" fill="var(--iface)"/><text x="655" y="335" text-anchor="middle" fill="var(--bg)" font-size="11" font-weight="700">LEARNER</text><rect x="735" y="300" width="105" height="62" rx="10" fill="var(--obs)"/><text x="787" y="327" text-anchor="middle" fill="var(--bg)" font-size="11" font-weight="700">WEB / AI</text><text x="787" y="346" text-anchor="middle" fill="var(--bg)" font-size="9">prototype</text><circle cx="925" cy="330" r="32" fill="var(--viable)"/><text x="925" y="326" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="700">STEM</text><text x="925" y="342" text-anchor="middle" fill="var(--bg)" font-size="10" font-weight="700">TASK</text><path d="M687 330H733M840 330H891" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/><path d="M925 366C880 394 720 396 655 366" class="viable" stroke-width="2" stroke-dasharray="7 5"/><path d="M988 275H1046" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
<rect x="1046" y="145" width="484" height="265" rx="20" class="panel"/><text x="1071" y="185" class="fg" font-size="21" font-weight="700">3 · Impact-inference gate</text><text x="1071" y="225" class="fg math" font-size="18">Δ=𝔼[Y|intervention]−𝔼[Y|counterfactual]</text><text x="1071" y="257" class="muted" font-size="14">requires study design, denominator, baseline, follow-up and confounding controls</text><path d="M1085 360H1490M1085 360V285" stroke="var(--muted)"/><path d="M1095 345C1170 342 1240 329 1315 300S1435 285 1480 273" class="hyp" stroke-width="4"/><path d="M1095 345C1170 344 1240 340 1315 334S1435 332 1480 329" stroke="var(--muted)" fill="none" stroke-width="3" stroke-dasharray="8 6"/><text x="1320" y="289" fill="var(--hyp)" font-size="12">hypothetical intervention</text><text x="1320" y="351" class="muted" font-size="12">counterfactual</text>
<rect x="70" y="460" width="1460" height="245" rx="20" class="panel"/><text x="95" y="500" class="fg" font-size="21" font-weight="700">4 · Product evidence vs impact evidence</text><g transform="translate(100 545)" font-size="13" font-weight="700"><rect width="210" height="70" rx="14" fill="var(--obs)"/><text x="105" y="30" text-anchor="middle" fill="var(--bg)">Next.js / React / TS</text><text x="105" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">implemented product</text><path d="M210 35H245" stroke="var(--muted)" marker-end="url(#a)"/><rect x="255" width="210" height="70" rx="14" fill="var(--viable)"/><text x="360" y="30" text-anchor="middle" fill="var(--bg)">build / lint / tests</text><text x="360" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">software verification</text><path d="M465 35H500" stroke="var(--muted)" marker-end="url(#a)"/><rect x="510" width="210" height="70" rx="14" fill="var(--unc)"/><text x="615" y="30" text-anchor="middle" fill="var(--bg)">UI counters</text><text x="615" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">prototype content</text><path d="M720 35H755" stroke="var(--muted)" marker-end="url(#a)"/><rect x="765" width="210" height="70" rx="14" fill="var(--hyp)"/><text x="870" y="30" text-anchor="middle" fill="var(--bg)">learning outcomes</text><text x="870" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">not validated</text><path d="M975 35H1010" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1020" width="210" height="70" rx="14" fill="var(--state)"/><text x="1125" y="30" text-anchor="middle" fill="var(--bg)">field adoption</text><text x="1125" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">future evidence gate</text><path d="M1230 35H1265" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1275" width="135" height="70" rx="14" fill="var(--iface)"/><text x="1342" y="30" text-anchor="middle" fill="var(--bg)">claim</text><text x="1342" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">bounded</text></g><text x="95" y="670" class="muted" font-size="13">Implemented interface ≠ validated intervention. Theme adaptation changes presentation only; energy equations, prototype status and empirical gates remain invariant.</text></svg>