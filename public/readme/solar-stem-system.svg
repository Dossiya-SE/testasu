<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">Solar plus STEM systems architecture</title><desc id="d">Visual showing solar energy balance, device availability, learning interaction and evidence gates for an educational technology prototype.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2a37"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs><rect width="1600" height="820" rx="30" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="72" fill="#f1fbff" font-size="31" font-weight="800">SOLAR + STEM — PHYSICAL ENERGY → DIGITAL LEARNING → VALIDATION</text><text x="70" y="104" fill="#a1c7d4" font-size="16">web prototype architecture · impact claims remain future empirical gates</text>
